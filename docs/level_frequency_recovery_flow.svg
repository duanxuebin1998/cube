<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111827; }
      .title { font-size: 42px; font-weight: 700; }
      .node { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .decision { fill: #fff7ed; stroke: #1f2937; stroke-width: 2; }
      .ok { fill: #ecfdf5; stroke: #1f2937; stroke-width: 2; }
      .err { fill: #fef2f2; stroke: #1f2937; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .label { font-size: 24px; fill: #0f172a; }
      .body { font-size: 30px; }
      .note { font-size: 24px; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1400" height="1900" fill="#f7f9fb"/>
  <text x="700" y="60" class="title" text-anchor="middle">液位频率连续异常恢复流程</text>

  <rect x="550" y="100" width="300" height="76" rx="14" class="node"/>
  <text x="700" y="148" class="body" text-anchor="middle">开始读取液位频率</text>

  <rect x="550" y="230" width="300" height="76" rx="14" class="node"/>
  <text x="700" y="278" class="body" text-anchor="middle">读取一次频率</text>

  <polygon points="700,380 860,440 700,500 540,440" class="decision"/>
  <text x="700" y="430" class="body" text-anchor="middle">频率有效？</text>
  <text x="700" y="464" class="body" text-anchor="middle">&gt;0 且 ≤6500Hz</text>

  <rect x="550" y="570" width="300" height="86" rx="14" class="ok"/>
  <text x="700" y="607" class="body" text-anchor="middle">保存当前频率</text>
  <text x="700" y="641" class="body" text-anchor="middle">返回正常</text>

  <rect x="550" y="745" width="300" height="76" rx="14" class="node"/>
  <text x="700" y="793" class="body" text-anchor="middle">记录一次频率异常</text>

  <polygon points="700,900 860,960 700,1020 540,960" class="decision"/>
  <text x="700" y="970" class="body" text-anchor="middle">连续异常达到3次？</text>

  <rect x="200" y="920" width="300" height="86" rx="14" class="node"/>
  <text x="350" y="957" class="body" text-anchor="middle">等待1秒</text>
  <text x="350" y="991" class="body" text-anchor="middle">继续读取</text>

  <polygon points="700,1080 860,1140 700,1200 540,1140" class="decision"/>
  <text x="700" y="1150" class="body" text-anchor="middle">恢复次数已达3轮？</text>

  <rect x="940" y="1102" width="300" height="76" rx="14" class="err"/>
  <text x="1090" y="1150" class="body" text-anchor="middle">返回液位频率异常</text>

  <rect x="550" y="1270" width="300" height="76" rx="14" class="node"/>
  <text x="700" y="1318" class="body" text-anchor="middle">恢复次数加1</text>

  <polygon points="700,1420 860,1480 700,1540 540,1480" class="decision"/>
  <text x="700" y="1490" class="body" text-anchor="middle">电机静止？</text>

  <rect x="550" y="1620" width="300" height="76" rx="14" class="node"/>
  <text x="700" y="1668" class="body" text-anchor="middle">电机上行1mm</text>

  <polygon points="700,1760 860,1820 700,1880 540,1820" class="decision"/>
  <text x="700" y="1830" class="body" text-anchor="middle">上行成功？</text>

  <rect x="940" y="1782" width="300" height="76" rx="14" class="err"/>
  <text x="1090" y="1830" class="body" text-anchor="middle">返回上行错误</text>

  <rect x="90" y="1650" width="330" height="86" rx="14" class="node"/>
  <text x="255" y="1687" class="body" text-anchor="middle">切换到密度模式</text>
  <text x="255" y="1721" class="body" text-anchor="middle">等待3秒</text>

  <rect x="90" y="1450" width="330" height="86" rx="14" class="node"/>
  <text x="255" y="1487" class="body" text-anchor="middle">切回液位模式</text>
  <text x="255" y="1521" class="body" text-anchor="middle">等待10秒稳定</text>

  <rect x="120" y="80" width="1160" height="52" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="700" y="114" class="note" text-anchor="middle">说明：恢复动作只在电机静止时执行；运动中直接返回异常，避免抢占电机控制。</text>

  <path d="M700 176 L700 230" class="line"/>
  <path d="M700 306 L700 380" class="line"/>
  <path d="M700 500 L700 570" class="line"/>
  <text x="718" y="540" class="label">是</text>

  <path d="M860 440 C980 440 980 783 850 783" class="line"/>
  <text x="942" y="500" class="label">否</text>

  <path d="M700 821 L700 900" class="line"/>
  <path d="M540 960 L500 960" class="line"/>
  <text x="510" y="940" class="label">否</text>

  <path d="M350 920 C350 268 550 268 550 268" class="line"/>
  <path d="M700 1020 L700 1080" class="line"/>
  <text x="718" y="1055" class="label">是</text>

  <path d="M860 1140 L940 1140" class="line"/>
  <text x="885" y="1120" class="label">是</text>

  <path d="M700 1200 L700 1270" class="line"/>
  <text x="718" y="1238" class="label">否</text>

  <path d="M700 1346 L700 1420" class="line"/>
  <path d="M860 1480 C1090 1480 1090 1178 1090 1178" class="line"/>
  <text x="905" y="1458" class="label">否</text>

  <path d="M700 1540 L700 1620" class="line"/>
  <text x="718" y="1590" class="label">是</text>

  <path d="M700 1696 L700 1760" class="line"/>
  <path d="M860 1820 L940 1820" class="line"/>
  <text x="885" y="1800" class="label">否</text>

  <path d="M540 1820 C430 1820 430 1693 420 1693" class="line"/>
  <text x="475" y="1795" class="label">是</text>

  <path d="M255 1650 L255 1536" class="line"/>
  <path d="M255 1450 C255 268 550 268 550 268" class="line"/>
</svg>
