<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPU3 菜单 UI 预览</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #5d6974;
      --line: #d6dde3;
      --paper: #f7f8f7;
      --panel: #ffffff;
      --oled: #08110f;
      --oled-line: #9df8d8;
      --oled-dim: #477766;
      --accent: #216e6a;
      --accent-2: #b34d2f;
      --warn: #ad5f00;
      --good: #28724b;
      --shadow: 0 18px 50px rgba(26, 39, 49, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      letter-spacing: 0;
    }

    button,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
    }

    .rail {
      border-right: 1px solid var(--line);
      background: #fbfbfa;
      padding: 18px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .version {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .search {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: var(--panel);
      color: var(--ink);
      outline: none;
    }

    .tree {
      margin-top: 14px;
      display: grid;
      gap: 6px;
    }

    .tree button {
      width: 100%;
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      padding: 7px 9px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .tree button:hover {
      background: #edf3f1;
    }

    .tree button.active {
      background: #dfeeea;
      border-color: #b7d4cc;
      color: #0f504b;
      font-weight: 700;
    }

    .tree .meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .main {
      padding: 22px;
      overflow: auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .crumbs {
      color: var(--muted);
      font-size: 13px;
    }

    .view-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--panel);
    }

    .seg button {
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      min-height: 34px;
      min-width: 46px;
      padding: 0 10px;
      cursor: pointer;
      color: var(--muted);
    }

    .seg button:last-child {
      border-right: 0;
    }

    .seg button.active {
      background: var(--accent);
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 520px) minmax(320px, 1fr);
      gap: 22px;
      align-items: start;
    }

    .device {
      background: #21282d;
      border-radius: 8px;
      padding: 22px;
      box-shadow: var(--shadow);
      color: #e9efed;
    }

    .bezel {
      background: #14191c;
      border: 1px solid #3a454b;
      border-radius: 8px;
      padding: 18px;
    }

    .oled {
      width: 100%;
      aspect-ratio: 2 / 1;
      background:
        linear-gradient(rgba(255,255,255,.035) 50%, transparent 50%) 0 0 / 100% 16px,
        radial-gradient(circle at 20% 15%, rgba(157,248,216,.10), transparent 34%),
        var(--oled);
      border: 2px solid #4b5c61;
      border-radius: 4px;
      padding: 16px 18px;
      font-family: "Consolas", "Microsoft YaHei", monospace;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      box-shadow: inset 0 0 30px rgba(0,0,0,.75);
    }

    .oled-line {
      color: var(--oled-line);
      display: grid;
      grid-template-columns: 18px 1fr;
      align-items: center;
      min-width: 0;
      text-shadow: 0 0 8px rgba(157, 248, 216, .25);
    }

    .oled-line .cursor {
      color: var(--oled-dim);
      font-weight: 700;
    }

    .oled-line.selected .cursor,
    .oled-line.selected .text {
      color: #06120f;
      background: var(--oled-line);
      text-shadow: none;
    }

    .oled-line.selected .cursor {
      border-radius: 2px 0 0 2px;
      padding-left: 3px;
    }

    .oled-line.selected .text {
      border-radius: 0 2px 2px 0;
      padding-left: 2px;
    }

    .text {
      min-width: 0;
      white-space: pre;
      overflow: hidden;
    }

    .text.warn {
      color: #ffd28a;
    }

    .keypad {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 46px);
      gap: 8px;
      justify-content: center;
    }

    .keypad button {
      border: 1px solid #58656c;
      border-radius: 6px;
      background: #333d43;
      color: #f4f7f6;
      cursor: pointer;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.3);
    }

    .keypad button:active {
      transform: translateY(1px);
    }

    .key-up {
      grid-column: 2;
      grid-row: 1;
    }

    .key-back {
      grid-column: 1;
      grid-row: 2;
    }

    .key-ok {
      grid-column: 2;
      grid-row: 2;
      background: #216e6a !important;
      border-color: #66aaa2 !important;
    }

    .key-down {
      grid-column: 2;
      grid-row: 3;
    }

    .legend {
      margin-top: 14px;
      color: #c9d2cf;
      font-size: 13px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 26px rgba(26, 39, 49, .06);
    }

    .panel + .panel {
      margin-top: 14px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 70px;
      background: #fbfcfb;
    }

    .metric b {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 8px 6px;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .tag {
      display: inline-block;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      background: #edf2f0;
      color: var(--muted);
    }

    .tag.warn {
      background: #fff0d5;
      color: var(--warn);
    }

    .tag.good {
      background: #def1e7;
      color: var(--good);
    }

    .notes {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .rail {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <h1>CPU3 菜单 UI 预览</h1>
        <span class="version">V1.10.1.0</span>
      </div>
      <input id="search" class="search" type="search" placeholder="搜索菜单或参数">
      <div id="tree" class="tree"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <div id="crumbs" class="crumbs">主菜单</div>
        </div>
        <div class="view-tools">
          <div class="seg" aria-label="语言">
            <button id="langZh" class="active" type="button">中</button>
            <button id="langEn" type="button">EN</button>
          </div>
          <div class="seg" aria-label="列表模式">
            <button id="modeShort" class="active" type="button">短名</button>
            <button id="modeValue" type="button">带值</button>
          </div>
        </div>
      </div>

      <div class="layout">
        <section class="device" aria-label="OLED 预览">
          <div class="bezel">
            <div id="oled" class="oled"></div>
          </div>
          <div class="keypad">
            <button class="key-up" type="button" data-key="up">▲</button>
            <button class="key-back" type="button" data-key="back">返回</button>
            <button class="key-ok" type="button" data-key="ok">确认</button>
            <button class="key-down" type="button" data-key="down">▼</button>
          </div>
          <div class="legend">
            <span>键盘：↑ ↓ Enter Esc</span>
            <span>四行 OLED / 每行约 8 个汉字</span>
          </div>
        </section>

        <section>
          <div class="panel">
            <h2>当前页面</h2>
            <div class="grid">
              <div class="metric">
                <b id="metricPage">主菜单</b>
                <span>页面</span>
              </div>
              <div class="metric">
                <b id="metricMode">列表</b>
                <span>交互模式</span>
              </div>
              <div class="metric">
                <b id="metricItems">0</b>
                <span>可见项</span>
              </div>
              <div class="metric">
                <b id="metricOverflow">0</b>
                <span>疑似超长行</span>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2>行宽检查</h2>
            <table>
              <thead>
                <tr>
                  <th>显示文本</th>
                  <th>长度</th>
                  <th>建议</th>
                </tr>
              </thead>
              <tbody id="overflowRows"></tbody>
            </table>
          </div>

          <div class="panel">
            <h2>预览规则</h2>
            <ul class="notes">
              <li>列表页优先显示短名，详情页保留完整名称。</li>
              <li>选择型参数在详情页按确认后进入候选列表。</li>
              <li>最后一项“非法配置”只用于异常显示，预览页不作为可选项展示。</li>
              <li>行宽按汉字 2 列、ASCII 1 列估算，用于提前发现截断风险。</li>
            </ul>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const ROW_LIMIT = 16;
    const state = {
      lang: "zh",
      listMode: "short",
      view: "list",
      pageId: "main",
      selected: 0,
      stack: [],
      editing: null,
      pageOffset: 0
    };

    const labels = {
      back: { zh: "返回", en: "Back" },
      ok: { zh: "确认", en: "Ok" },
      alter: { zh: "修改", en: "Alter" },
      save: { zh: "保存", en: "Save" },
      cancel: { zh: "取消", en: "Cancel" },

    const pages = {

          { type: "param", param: "language" }
        ]
      },
      params: {
        title: { zh: "参数配置", en: "Params" },
        items: [
          { type: "page", target: "devInfo", name: { zh: "基础信息", en: "Info" }, short: { zh: "基础", en: "Info" } },
          { type: "page", target: "mech", name: { zh: "电机与编码参数", en: "Mechanism" }, short: { zh: "电机编码", en: "Mechanism" } },
          { type: "page", target: "liquid", name: { zh: "液位参数", en: "Level" }, short: { zh: "液位", en: "Level" } },
          { type: "page", target: "policy", name: { zh: "密度测量参数", en: "Policy" }, short: { zh: "密度策略", en: "Policy" } },
          { type: "page", target: "output", name: { zh: "输出配置", en: "Output" }, short: { zh: "输出", en: "Output" } },

      },

        title: { zh: "基础信息", en: "Info" },

      output: {

          { type: "page", target: "ao", name: { zh: "AO输出", en: "AO" }, short: { zh: "AO", en: "AO" } }
        ]
      },
      relay: {
        title: { zh: "继电器报警", en: "Relay" },
        items: [
          { type: "page", target: "relay1", name: { zh: "R1继电器", en: "Relay1" }, short: { zh: "R1", en: "R1" } },
          { type: "page", target: "relay2", name: { zh: "R2继电器", en: "Relay2" }, short: { zh: "R2", en: "R2" } },
          { type: "page", target: "relay3", name: { zh: "R3继电器", en: "Relay3" }, short: { zh: "R3", en: "R3" } },
          { type: "page", target: "relay4", name: { zh: "R4继电器", en: "Relay4" }, short: { zh: "R4", en: "R4" } }
        ]
      },
      relay1: {
        title: { zh: "R1继电器", en: "Relay1" },

          { type: "param", param: "relayMode" },

      relay2: { title: { zh: "R2继电器", en: "Relay2" }, items: [] },

    pages.relay2.items = pages.relay1.items;
    pages.relay3.items = pages.relay1.items;
    pages.relay4.items = pages.relay1.items;

    const params = {
      language: p("语言", "Lang", "语言", "Lang", "select", "中文", ["中文", "英文"]),
      powerOnCmd: p("上电默认指令", "PwrOnCmd", "默认指令", "PwrOn", "select", "无", ["无", "回零点", "寻找液位", "单点监测", "水位跟随"]),

      levelMode: p("液位测量方式", "LvlMeasMode", "液位方式", "LvlMode", "select", "相对频率", ["相对频率", "定频", "密度找液位", "超声"]),

      needBottom: p("是否测罐底", "NeedBottom", "测罐底", "Bottom", "select", "是", ["否", "是"]),

      relayContact: p("R1接点", "R1Contact", "接点", "Contact", "select", "常开", ["常开", "常闭"]),
      relayAlarmMode: p("R1报警模式", "R1AlarmMode", "报警模式", "AlarmMode", "select", "关闭", ["关闭", "开启", "Latch"]),
      relaySource: p("R1报警取值源", "R1ValueSrc", "取值源", "Source", "select", "储罐液位", ["储罐液位", "液相温度", "水位", "浮子位置", "无"]),
      relayHigh: p("R1高值", "R1HValue", "高值", "High", "number", "12000.0"),
      rangeStart: p("输出范围起点mA", "RangeStart", "量程起点", "Start", "number", "4.00mA"),
      rangeEnd: p("输出范围终点mA", "RangeEnd", "量程终点", "End", "number", "20.00mA"),
      faultCurrent: p("故障电流mA", "FaultCurrent", "故障电流", "Fault", "number", "22.00mA"),
      srcOil: p("液位数据源", "SrcOil", "液位源", "OilSrc", "select", "设备测量", ["设备测量", "手工输入"]),
      srcWater: p("水位数据源", "SrcWater", "水位源", "WaterSrc", "select", "设备测量", ["设备测量", "手工输入"]),
      srcDensity: p("密度数据源", "SrcD", "密度源", "DensSrc", "select", "手工输入", ["设备测量", "手工输入"]),
      srcTemp: p("温度数据源", "SrcT", "温度源", "TempSrc", "select", "设备测量", ["设备测量", "手工输入"]),
      densityUpload: p("密度手输上传", "InDSw", "密度上传", "DUpload", "select", "开启", ["关闭", "开启"]),
      com1Baud: p("COM1波特率", "C1Baud", "波特率", "Baud", "select", "9600", ["1200", "2400", "4800", "9600", "19200", "38400"]),
      com1Parity: p("COM1校验", "C1Parity", "校验", "Parity", "select", "无校验", ["无校验", "偶校验", "奇校验"]),
      com1Stop: p("COM1停止位", "C1Stop", "停止位", "Stop", "select", "1位", ["1位", "2位"]),
      com1Protocol: p("COM1协议", "C1Proto", "协议", "Proto", "select", "SI7000协议", ["计量仪协议", "瓦锡兰协议", "LTD协议", "预留1", "预留2", "SI7000协议"]),
      singlePoint: p("密度单点测量", "SingleMeasure", "单点测量", "Single", "number", "6000.0mm"),
      runToPosition: p("浮子运行到高度", "RunToPos", "运行到高度", "RunTo", "number", "3000.0mm"),
      runUp: p("上行", "MoveUp", "上行", "Up", "number", "100.0mm"),
      runDown: p("下行", "MoveDown", "下行", "Down", "number", "100.0mm")
    };

    function p(nameZh, nameEn, shortZh, shortEn, editor, value, options, range) {
      return {
        name: { zh: nameZh, en: nameEn },
        short: { zh: shortZh, en: shortEn },
        editor,
        value,
        options: options || [],
        range: range || ""
      };
    }

    function t(obj) {
      return obj[state.lang] || obj.zh || "";
    }

    function widthOf(str) {
      let width = 0;
      for (const ch of str) {
        width += ch.charCodeAt(0) > 255 ? 2 : 1;
      }
      return width;
    }

    function clip(str) {
      let width = 0;
      let out = "";
      for (const ch of str) {
        const w = ch.charCodeAt(0) > 255 ? 2 : 1;
        if (width + w > ROW_LIMIT) return out;
        out += ch;
        width += w;
      }
      return out;
    }

    function itemText(item, includeValue) {
      if (item.type === "page") return t(item.short || item.name);
      const param = params[item.param];
      const name = t(param.short);
      if (!includeValue) return name;
      return `${name}:${param.value}`;
    }

    function currentPage() {
      return pages[state.pageId];
    }

    function visibleItems() {
      const page = currentPage();
      const items = page.items;
      const rows = items.slice(state.pageOffset, state.pageOffset + 4);
      while (rows.length < 4) rows.push({ type: "empty" });
      return rows;
    }

    function renderTree() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const tree = document.getElementById("tree");
      tree.innerHTML = "";
      Object.entries(pages).forEach(([id, page]) => {
        const title = t(page.title);
        if (query && !title.toLowerCase().includes(query)) {
          const hasParam = page.items.some(item => item.type === "param" && t(params[item.param].name).toLowerCase().includes(query));
          if (!hasParam) return;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = id === state.pageId ? "active" : "";
        btn.innerHTML = `<span>${title}</span><span class="meta">${page.items.length}</span>`;
        btn.addEventListener("click", () => {
          state.pageId = id;
          state.view = "list";
          state.selected = 0;
          state.pageOffset = 0;
          state.stack = [];
          render();
        });
        tree.appendChild(btn);
      });
    }

    function renderOled() {
      const oled = document.getElementById("oled");
      oled.innerHTML = "";
      let rows = [];
      if (state.view === "list") rows = renderListRows();
      if (state.view === "detail") rows = renderDetailRows();
      if (state.view === "select") rows = renderSelectRows();
      if (state.view === "number") rows = renderNumberRows();

      rows.forEach(row => {
        const div = document.createElement("div");
        div.className = `oled-line${row.selected ? " selected" : ""}`;
        const text = clip(row.text);
        const warn = widthOf(row.text) > ROW_LIMIT ? " warn" : "";
        div.innerHTML = `<span class="cursor">${row.selected ? ">" : " "}</span><span class="text${warn}">${text}</span>`;
        oled.appendChild(div);
      });
    }

    function renderListRows() {
      const includeValue = state.listMode === "value";
      return visibleItems().map((item, idx) => {
        if (item.type === "empty") return { text: "", selected: false };
        return {
          text: itemText(item, includeValue),
          selected: state.selected === state.pageOffset + idx
        };
      });
    }

    function renderDetailRows() {
      const param = params[state.editing];
      const kind = param.editor === "select" ? labels.select : labels.input;
      return [
        { text: clip(t(param.name)), selected: false },
        { text: `${t(labels.value)}:${param.value}`, selected: false },
        { text: param.range ? `范围:${param.range}` : t(kind), selected: false },
        { text: `${t(labels.back)}  ${t(labels.alter)}`, selected: true }
      ];
    }

    function renderSelectRows() {
      const param = params[state.editing];
      return param.options.slice(0, 4).map((option, idx) => ({
        text: option,
        selected: idx === state.selected
      }));
    }

    function renderNumberRows() {
      const param = params[state.editing];
      return [
        { text: clip(t(param.name)), selected: false },
        { text: `${t(labels.value)}:${param.value}`, selected: false },
        { text: param.range ? `范围:${param.range}` : "逐位输入", selected: false },
        { text: `${t(labels.cancel)}  ${t(labels.save)}`, selected: true }
      ];
    }

    function renderMetrics() {
      const page = currentPage();
      document.getElementById("metricPage").textContent = t(page.title);
      document.getElementById("metricMode").textContent =
        state.view === "list" ? "列表" :
        state.view === "detail" ? "详情" :
        state.view === "select" ? "选择" : "输入";
      document.getElementById("metricItems").textContent = page.items.length;
      const allTexts = page.items.map(item => itemText(item, state.listMode === "value"));
      const overflow = allTexts.filter(text => widthOf(text) > ROW_LIMIT);
      document.getElementById("metricOverflow").textContent = overflow.length;
      const tbody = document.getElementById("overflowRows");
      tbody.innerHTML = "";
      if (overflow.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3"><span class="tag good">当前页无明显超长行</span></td></tr>`;
        return;
      }
      overflow.forEach(text => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${text}</td><td>${widthOf(text)}</td><td><span class="tag warn">建议短名或详情页显示</span></td>`;
        tbody.appendChild(tr);
      });
    }

    function renderCrumbs() {
      const names = state.stack.map(id => t(pages[id].title));
      names.push(t(currentPage().title));
      document.getElementById("crumbs").textContent = names.join(" > ");
    }

    function move(delta) {
      if (state.view === "list") {
        const len = currentPage().items.length;
        state.selected = (state.selected + delta + len) % len;
        if (state.selected < state.pageOffset) state.pageOffset = state.selected;
        if (state.selected >= state.pageOffset + 4) state.pageOffset = state.selected - 3;
      } else if (state.view === "select") {
        const param = params[state.editing];
        const len = param.options.length;
        state.selected = (state.selected + delta + len) % len;
      }
      render();
    }

    function ok() {
      if (state.view === "list") {
        const item = currentPage().items[state.selected];
        if (!item) return;
        if (item.type === "page") {
          state.stack.push(state.pageId);
          state.pageId = item.target;
          state.selected = 0;
          state.pageOffset = 0;
        } else if (item.type === "param") {
          state.editing = item.param;
          state.view = "detail";
        }
      } else if (state.view === "detail") {
        const param = params[state.editing];
        if (param.editor === "select") {
          state.view = "select";
          state.selected = Math.max(0, param.options.indexOf(param.value));
        } else {
          state.view = "number";
        }
      } else if (state.view === "select") {
        const param = params[state.editing];
        param.value = param.options[state.selected];
        state.view = "detail";
      } else if (state.view === "number") {
        state.view = "detail";
      }
      render();
    }

    function back() {
      if (state.view !== "list") {
        state.view = "list";
        state.editing = null;
      } else if (state.stack.length > 0) {
        state.pageId = state.stack.pop();
        state.selected = 0;
        state.pageOffset = 0;
      }
      render();
    }

    function render() {
      document.getElementById("langZh").classList.toggle("active", state.lang === "zh");
      document.getElementById("langEn").classList.toggle("active", state.lang === "en");
      document.getElementById("modeShort").classList.toggle("active", state.listMode === "short");
      document.getElementById("modeValue").classList.toggle("active", state.listMode === "value");
      renderTree();
      renderCrumbs();
      renderOled();
      renderMetrics();
    }

    document.querySelectorAll(".keypad button").forEach(button => {
      button.addEventListener("click", () => {
        const key = button.dataset.key;
        if (key === "up") move(-1);
        if (key === "down") move(1);
        if (key === "ok") ok();
        if (key === "back") back();
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowUp") { event.preventDefault(); move(-1); }
      if (event.key === "ArrowDown") { event.preventDefault(); move(1); }
      if (event.key === "Enter") { event.preventDefault(); ok(); }
      if (event.key === "Escape") { event.preventDefault(); back(); }
    });

    document.getElementById("langZh").addEventListener("click", () => { state.lang = "zh"; render(); });
    document.getElementById("langEn").addEventListener("click", () => { state.lang = "en"; render(); });
    document.getElementById("modeShort").addEventListener("click", () => { state.listMode = "short"; render(); });
    document.getElementById("modeValue").addEventListener("click", () => { state.listMode = "value"; render(); });
    document.getElementById("search").addEventListener("input", renderTree);

    render();
  </script>
</body>
</html>
