<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPU3 参数菜单排序工具</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1d232a;
      --muted: #68717d;
      --line: #d8dde5;
      --accent: #1f6feb;
      --accent-soft: #e8f1ff;
      --ok: #147a48;
      --warn: #a35d00;
      --danger: #b42318;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 64px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      flex-wrap: wrap;
    }

    input[type="search"] {
      width: min(360px, 100%);
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
    }

    button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button:disabled {
      color: #98a2b3;
      cursor: default;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      white-space: nowrap;
    }

    .toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    main {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(340px, 460px);
      gap: 16px;
      padding: 16px 20px 20px;
      align-items: start;
    }

    .surface {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .surface-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .surface-title {
      font-weight: 700;
    }

    .stat {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tree-wrap {
      padding: 12px;
      overflow: auto;
      max-height: calc(100vh - 118px);
    }

    .tree,
    .tree ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .children {
      margin-left: 18px;
      padding-left: 16px;
      border-left: 2px solid #d5dce7;
      min-height: 10px;
    }

    .node.depth-0 > .children {
      border-left-color: #b8c9ed;
    }

    .node.depth-1 > .children {
      border-left-color: #a8d9ce;
    }

    .node.depth-2 > .children {
      border-left-color: #efd6a0;
    }

    .node {
      margin: 5px 0;
    }

    .node-row {
      display: grid;
      grid-template-columns: 28px minmax(150px, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-left-width: 4px;
      border-radius: 6px;
      background: #fff;
      cursor: grab;
    }

    .node-row.depth-0 {
      border-left-color: var(--accent);
      background: #f7fbff;
    }

    .node-row.depth-1 {
      border-left-color: #159273;
      background: #fbfdfc;
    }

    .node-row.depth-2 {
      border-left-color: #c17a00;
      background: #fffdf7;
    }

    .node-row.depth-3,
    .node-row.depth-4 {
      border-left-color: #778391;
      background: #ffffff;
    }

    .node-row:active {
      cursor: grabbing;
    }

    .node-row.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
    }

    .node-row.dragging {
      opacity: 0.45;
    }

    .node-row.drop-before {
      border-top-color: var(--accent);
      border-top-width: 3px;
    }

    .node-row.drop-after {
      border-bottom-color: var(--accent);
      border-bottom-width: 3px;
    }

    .drag-handle {
      width: 20px;
      color: var(--muted);
      font-size: 18px;
      text-align: center;
    }

    .name {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .level-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      min-height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      background: #eef2f7;
      color: #475467;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .node-row.depth-0 .level-chip {
      background: var(--accent-soft);
      color: #164ea6;
    }

    .node-row.depth-1 .level-chip {
      background: #e7f6f2;
      color: #0e6f58;
    }

    .node-row.depth-2 .level-chip {
      background: #fff3d6;
      color: #8a5400;
    }

    .name strong {
      font-size: 14px;
      font-weight: 650;
      word-break: break-word;
    }

    .node-row.depth-0 .name strong {
      font-weight: 700;
    }

    .node-row.depth-2 .name strong,
    .node-row.depth-3 .name strong,
    .node-row.depth-4 .name strong {
      font-weight: 600;
    }

    .en {
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #edf0f3;
      color: #394150;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.menu {
      background: var(--accent-soft);
      color: #164ea6;
    }

    .badge.param {
      background: #e8f7ef;
      color: var(--ok);
    }

    .badge.readonly,
    .badge.runtime {
      background: #fff4e5;
      color: var(--warn);
    }

    .badge.action {
      background: #f2eafd;
      color: #6f3bb7;
    }

    .badge.is-empty {
      display: none;
    }

    .path {
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    .side {
      position: sticky;
      top: 80px;
      display: grid;
      gap: 16px;
    }

    .panel-body {
      padding: 12px 14px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px 10px;
      align-items: start;
    }

    .detail-grid dt {
      color: var(--muted);
    }

    .detail-grid dd {
      margin: 0;
      word-break: break-word;
    }

    .detail-grid dd.code-value {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.35;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .edit-form {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .edit-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .edit-row label {
      color: var(--muted);
    }

    .edit-row input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    .edit-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
      color: var(--ink);
      font: 12px Consolas, "Courier New", monospace;
      line-height: 1.45;
      white-space: pre;
    }

    .warn-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .warn-list li {
      padding: 8px 10px;
      border-radius: 6px;
      background: #fff8e8;
      color: #724300;
      border: 1px solid #f5d78e;
    }

    .warn-list li.ok {
      background: #ebf8f1;
      color: #0f6038;
      border-color: #a7dfbe;
    }

    .hidden-input {
      display: none;
    }

    .drop-target {
      outline: 2px solid rgba(31, 111, 235, 0.22);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .node-row.drop-inside {
      outline: 2px solid rgba(31, 111, 235, 0.45);
      outline-offset: -2px;
      background: #eef5ff;
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }

      .tree-wrap {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CPU3 参数菜单排序工具</h1>
    <div class="toolbar">
      <input id="searchBox" type="search" placeholder="搜索中文名、英文名、操作码、分组">
      <button id="expandAll" type="button">展开</button>
      <button id="collapseAll" type="button">折叠</button>
      <button id="resetBtn" type="button">恢复当前源码顺序</button>
      <button id="downloadBtn" type="button" class="primary">下载排序结果</button>
      <label class="file-button" for="importFile">导入结果</label>
      <input id="importFile" class="hidden-input" type="file" accept="application/json,.json">
    </div>
  </header>

  <main>
    <section class="surface">
      <div class="surface-header">
        <div class="surface-title">菜单树</div>
        <div id="treeStat" class="stat"></div>
      </div>
      <div class="tree-wrap">
        <ul id="treeRoot" class="tree"></ul>
      </div>
    </section>

    <aside class="side">
      <section class="surface">
        <div class="surface-header">
          <div class="surface-title">选中项</div>
          <div id="selectedType" class="stat"></div>
        </div>
        <div class="panel-body">
          <div id="editFormHost"></div>
          <dl id="detailGrid" class="detail-grid"></dl>
        </div>
      </section>

      <section class="surface">
        <div class="surface-header">
          <div class="surface-title">检查结果</div>
          <div id="changeStat" class="stat"></div>
        </div>
        <div class="panel-body">
          <ul id="warningList" class="warn-list"></ul>
        </div>
      </section>

      <section class="surface">
        <div class="surface-header">
          <div class="surface-title">导出内容</div>
          <button id="copyBtn" type="button">复制</button>
        </div>
        <div class="panel-body">
          <textarea id="exportText" spellcheck="false"></textarea>
        </div>
      </section>
    </aside>
  </main>

              runtime("relay" + channel + "_clear", "清锁存", "Clear")
            ]
          }
        ]
      }));
    }

    function relayParam(channel, id, nameSuffix, enSuffix, suffix, floatValue = false) {
      return param(
        "r" + channel + "_" + id,
        "K" + channel + nameSuffix,
        "K" + channel + enSuffix,
        "COM_NUM_DEVICEPARAM_RELAY" + channel + "_" + suffix,
        "HOLDREGISTER_DEVICEPARAM_RELAY_" + suffix + "(" + (channel - 1) + "U)",
        true,
        ""
      );
    }

    function commMenu(channel) {
      return {
        id: "comm" + channel,
        type: "menu",
        name: "COM" + channel + "配置",
        en: "COM" + channel,
        code: "menu_cpu3_comm" + channel,
        keynum: "KEYNUM_MENU_CPU3_COM" + channel,
        group: "MENU_GRP_CPU3_COM" + channel,
        children: [
          param("c" + channel + "_proto", "COM" + channel + "协议", "C" + channel + "Proto", "COM_NUM_CPU3_COM" + channel + "_PROTOCOL", "HOLDREGISTER_CPU3_COM" + channel + "_PROTO", true),
          param("c" + channel + "_baud", "COM" + channel + "波特率", "C" + channel + "Baud", "COM_NUM_CPU3_COM" + channel + "_BAUDRATE", "HOLDREGISTER_CPU3_COM" + channel + "_BAUD", true),
          param("c" + channel + "_data", "COM" + channel + "数据位", "C" + channel + "Data", "COM_NUM_CPU3_COM" + channel + "_DATABITS", "HOLDREGISTER_CPU3_COM" + channel + "_DATABITS", true),
          param("c" + channel + "_parity", "COM" + channel + "校验", "C" + channel + "Parity", "COM_NUM_CPU3_COM" + channel + "_PARITY", "HOLDREGISTER_CPU3_COM" + channel + "_PARITY", true),
          param("c" + channel + "_stop", "COM" + channel + "停止位", "C" + channel + "Stop", "COM_NUM_CPU3_COM" + channel + "_STOPBITS", "HOLDREGISTER_CPU3_COM" + channel + "_STOPBITS", true)
        ]
      };
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function walk(node, fn, parent = null, path = []) {
      fn(node, parent, path);
      (node.children || []).forEach((child) => walk(child, fn, node, path.concat(node)));
    }

    function findNode(id, root = tree) {
      let found = null;
      walk(root, (node, parent, path) => {
        if (node.id === id) {
          found = { node, parent, path };
        }
      });
      return found;
    }

    function labelForType(type) {
      if (type === "menu" || type === "root") return "菜单";
      if (type === "param") return "可写参数";
      if (type === "readonly") return "只读参数";
      if (type === "runtime") return "运行态";
      if (type === "action") return "动作页";
      return type;
    }

    function textForNode(node) {
      return [
        node.name,
        node.en,
        node.id,
        node.code,
        node.keynum,
        node.group,
        node.opera,
        node.register,
        node.unit
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function nodeMatches(node, query) {
      if (!query) return true;
      const self = textForNode(node).includes(query);
      const child = (node.children || []).some((item) => nodeMatches(item, query));
      return self || child;
    }

    function render() {
      treeRoot.innerHTML = "";
      renderChildren(treeRoot, tree, 0);
      renderDetail();
      updateExport();
      updateWarnings();
      updateStats();
    }

    function renderChildren(container, parent, level) {
      container.dataset.parentId = parent.id;
      container.dataset.level = String(level);
      const query = searchBox.value.trim().toLowerCase();
      (parent.children || []).forEach((node) => {
        if (!nodeMatches(node, query)) return;
        container.appendChild(renderNode(node, parent, level));
      });
    }

    function renderNode(node, parent, level) {
      const li = document.createElement("li");
      const depthClass = "depth-" + Math.min(level, 4);
      li.className = "node " + depthClass;
      li.dataset.nodeId = node.id;
      li.dataset.parentId = parent.id;
      li.dataset.level = String(level);

      const row = document.createElement("div");
      row.className = "node-row " + depthClass + (node.id === selectedId ? " selected" : "");
      row.draggable = node.id !== "root";
      row.dataset.nodeId = node.id;
      row.dataset.parentId = parent.id;
      row.dataset.level = String(level);
      row.addEventListener("click", () => {
        selectedId = node.id;
        render();
      });
      row.addEventListener("dragstart", onDragStart);
      row.addEventListener("dragend", onDragEnd);
      row.addEventListener("dragover", onDragOverRow);
      row.addEventListener("drop", onDropRow);

      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.textContent = "≡";

      const name = document.createElement("div");
      name.className = "name";
      const levelChip = document.createElement("span");
      levelChip.className = "level-chip";
      levelChip.textContent = String(level + 1) + "级";
      const strong = document.createElement("strong");
      strong.textContent = node.name;
      const en = document.createElement("span");
      en.className = "en";
      en.textContent = node.en || "";
      name.append(levelChip, strong, en);

      const badge = document.createElement("span");
      badge.className = "badge " + node.type;
      badge.textContent = labelForType(node.type);

      const count = document.createElement("span");
      count.className = "badge";
      if (node.children && node.children.length) {
        count.textContent = String(node.children.length);
      } else if (node.unit) {
        count.textContent = node.unit;
      } else {
        count.classList.add("is-empty");
        count.setAttribute("aria-hidden", "true");
      }

      row.append(handle, name, badge, count);
      li.appendChild(row);

      if ((node.children || []).length > 0 && !collapsed.has(node.id)) {
        const childList = document.createElement("ul");
        childList.className = "children";
        childList.addEventListener("dragover", onDragOverList);
        childList.addEventListener("dragleave", onDragLeaveList);
        childList.addEventListener("drop", onDropList);
        renderChildren(childList, node, level + 1);
        li.appendChild(childList);
      }

      return li;
    }

    function onDragStart(event) {
      draggingId = event.currentTarget.dataset.nodeId;
      dragOver = null;
      clearDropMarkers();
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggingId);
      event.currentTarget.classList.add("dragging");
    }

    function onDragEnd(event) {
      event.currentTarget.classList.remove("dragging");
      finishDrag(false);
    }

    function finishDrag(shouldRender) {
      clearDropMarkers();
      draggingId = null;
      dragOver = null;
      if (shouldRender) render();
    }

    function canHaveChildren(node) {
      return node && (node.type === "root" || node.type === "menu");
    }

    function canParentAccept(parentNode, childNode) {
      if (!canHaveChildren(parentNode)) return false;
      if (parentNode.type === "root" && childNode.type !== "menu") return false;
      return true;
    }

    function subtreeDepth(node) {
      if (!node.children || node.children.length === 0) return 0;
      return 1 + Math.max(...node.children.map(subtreeDepth));
    }

    function allowedDrop(targetParentId, targetLevel) {
      if (!draggingId) return false;
      const dragged = findNode(draggingId);
      const targetParent = findNode(targetParentId);
      if (!dragged || !targetParent || dragged.node.id === targetParentId) return false;
      if (!canParentAccept(targetParent.node, dragged.node)) return false;
      if (targetLevel + subtreeDepth(dragged.node) > MAX_DISPLAY_LEVEL) return false;
      let insideDragged = false;
      walk(dragged.node, (node) => {
        if (node.id === targetParentId) insideDragged = true;
      });
      return !insideDragged;
    }

    function onDragOverRow(event) {
      if (!draggingId) return;
      event.stopPropagation();
      const row = event.currentTarget;
      const targetId = row.dataset.nodeId;
      const target = findNode(targetId);
      if (!target || !target.parent) return;
      const dragged = findNode(draggingId);
      if (!dragged) return;
      const targetLevel = Number(row.dataset.level);
      const rect = row.getBoundingClientRect();
      const offset = (event.clientY - rect.top) / Math.max(rect.height, 1);
      const canDropInside = offset > 0.25
        && offset < 0.75
        && canParentAccept(target.node, dragged.node)
        && allowedDrop(targetId, targetLevel + 1);
      const canDropBeside = allowedDrop(target.parent.id, targetLevel);
      if (!canDropInside && !canDropBeside) return;
      event.preventDefault();
      clearDropMarkers();
      if (canDropInside) {
        dragOver = { parentId: targetId, targetId: null, after: true };
        row.classList.add("drop-inside");
      } else {
        const after = offset > 0.5;
        dragOver = { parentId: target.parent.id, targetId, after };
        row.classList.add(after ? "drop-after" : "drop-before");
      }
    }

    function onDropRow(event) {
      event.preventDefault();
      event.stopPropagation();
      clearDropMarkers();
      if (!dragOver || !draggingId) return;
      const nodeId = draggingId;
      const nextDrop = dragOver;
      moveNode(nodeId, nextDrop.parentId, nextDrop.targetId, nextDrop.after);
      finishDrag(true);
    }

    function onDragOverList(event) {
      if (event.target !== event.currentTarget) return;
      const parentId = event.currentTarget.dataset.parentId;
      const level = Number(event.currentTarget.dataset.level);
      if (!allowedDrop(parentId, level)) return;
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget.classList.add("drop-target");
      dragOver = { parentId, targetId: null, after: true };
    }

    function onDragLeaveList(event) {
      if (event.target !== event.currentTarget) return;
      event.currentTarget.classList.remove("drop-target");
    }

    function onDropList(event) {
      event.preventDefault();
      event.stopPropagation();
      if (event.target !== event.currentTarget) return;
      event.currentTarget.classList.remove("drop-target");
      if (!dragOver || !draggingId) return;
      const nodeId = draggingId;
      const nextDrop = dragOver;
      moveNode(nodeId, nextDrop.parentId, null, true);
      finishDrag(true);
    }

    function clearDropMarkers() {
      document.querySelectorAll(".drop-before,.drop-after,.drop-inside,.drop-target").forEach((el) => {
        el.classList.remove("drop-before", "drop-after", "drop-inside", "drop-target");
      });
    }

    function moveNode(nodeId, newParentId, targetId, after) {
      const source = findNode(nodeId);
      const targetParentInfo = findNode(newParentId);
      if (!source || !source.parent || !targetParentInfo) return;
      const sourceSiblings = source.parent.children;
      const sourceIndex = sourceSiblings.findIndex((item) => item.id === nodeId);
      if (sourceIndex < 0) return;
      const [node] = sourceSiblings.splice(sourceIndex, 1);
      const targetSiblings = targetParentInfo.node.children || (targetParentInfo.node.children = []);
      let insertIndex = targetSiblings.length;
      if (targetId) {
        const targetIndex = targetSiblings.findIndex((item) => item.id === targetId);
        insertIndex = targetIndex < 0 ? targetSiblings.length : targetIndex + (after ? 1 : 0);
      }
      targetSiblings.splice(insertIndex, 0, node);
      selectedId = nodeId;
    }

    function renderDetail() {
      const info = findNode(selectedId) || findNode("root");
      const node = info.node;
      selectedType.textContent = labelForType(node.type);
      const path = info.path.concat(node).map((item) => item.name).join(" / ");
      const fields = [
        ["路径", path],
        ["ID", node.id],
        ["类型", labelForType(node.type)],
        ["中文", node.name],
        ["英文", node.en || ""],
        ["函数", node.code || ""],
        ["KEY", node.keynum || ""],
        ["分组", node.group || ""],
        ["操作码", node.opera || ""],
        ["寄存器", node.register || ""],
        ["写权限", node.writable === true ? "可写" : node.writable === false ? "只读" : ""],
        ["单位", node.unit || ""]
      ].filter(([, value]) => value !== "");
      const canEdit = node.type !== "root";
      editFormHost.innerHTML = canEdit ? `
        <div class="edit-form">
          <div class="edit-row">
            <label for="editNameCn">中文名</label>
            <input id="editNameCn" type="text" value="${escapeHtml(node.name)}">
          </div>
          <div class="edit-row">
            <label for="editNameEn">英文名</label>
            <input id="editNameEn" type="text" value="${escapeHtml(node.en || "")}">
          </div>
        </div>
      ` : "";
      detailGrid.innerHTML = fields.map(([key, value]) => {
        const codeClass = ["ID", "函数", "KEY", "分组", "操作码", "寄存器"].includes(key) ? " class=\"code-value\"" : "";
        return `<dt>${escapeHtml(key)}</dt><dd${codeClass}>${escapeHtml(value)}</dd>`;
      }).join("");
      if (canEdit) {
        bindNameEditor("editNameCn", "name", node.id);
        bindNameEditor("editNameEn", "en", node.id);
      }
    }

    function bindNameEditor(inputId, field, nodeId) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.addEventListener("input", () => {
        const current = findNode(nodeId);
        if (!current) return;
        current.node[field] = input.value;
        updateExport();
        updateWarnings();
        updateStats();
      });
      input.addEventListener("change", () => {
        render();
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function collectOrders(root) {
      const orders = [];
      walk(root, (node, parent, path) => {
        if (!canHaveChildren(node)) return;
        orders.push({
          parentId: node.id,
          parentName: node.name,
          parentPath: path.concat(node).map((item) => item.name).join(" / "),
          functionName: node.code || "",
          keynum: node.keynum || "",
          group: node.group || "",
          items: node.children.map((child, index) => ({
            index: index + 1,
            id: child.id,
            type: child.type,
            name: child.name,
            en: child.en || "",
            functionName: child.code || "",
            keynum: child.keynum || "",
            group: child.group || "",
            opera: child.opera || "",
            register: child.register || "",
            writable: child.writable === true,
            unit: child.unit || ""
          }))
        });
      });
      return orders;
    }

    function orderSignature(root) {
      const map = {};
      collectOrders(root).forEach((entry) => {
        map[entry.parentId] = entry.items.map((item) => item.id).join("|");
      });
      return map;
    }

    function diffSummary() {
      const before = orderSignature(initialTree);
      const after = orderSignature(tree);
      const orders = collectOrders(tree);
      return orders
        .filter((entry) => before[entry.parentId] !== after[entry.parentId])
        .map((entry) => ({
          parentId: entry.parentId,
          parentPath: entry.parentPath,
          before: (before[entry.parentId] || "").split("|").filter(Boolean),
          after: entry.items.map((item) => item.id)
        }));
    }

    function collectParentMap(root) {
      const map = {};
      walk(root, (node, parent, path) => {
        map[node.id] = parent ? {
          parentId: parent.id,
          parentName: parent.name,
          parentPath: path.map((item) => item.name).join(" / ")
        } : null;
      });
      return map;
    }

    function collectNodeMap(root) {
      const map = {};
      walk(root, (node) => {
        map[node.id] = {
          id: node.id,
          type: node.type,
          name: node.name,
          en: node.en || "",
          opera: node.opera || "",
          register: node.register || "",
          functionName: node.code || "",
          keynum: node.keynum || "",
          group: node.group || ""
        };
      });
      return map;
    }

    function nameChangeSummary() {
      const before = collectNodeMap(initialTree);
      const after = collectNodeMap(tree);
      return Object.keys(after)
        .filter((id) => before[id] && ((before[id].name !== after[id].name) || (before[id].en !== after[id].en)))
        .map((id) => ({
          id,
          type: after[id].type,
          opera: after[id].opera,
          functionName: after[id].functionName,
          beforeName: before[id].name,
          afterName: after[id].name,
          beforeEn: before[id].en,
          afterEn: after[id].en
        }));
    }

    function parentChangeSummary() {
      const before = collectParentMap(initialTree);
      const after = collectParentMap(tree);
      return Object.keys(after)
        .filter((id) => before[id] && after[id] && before[id].parentId !== after[id].parentId)
        .map((id) => {
          const current = findNode(id).node;
          return {
            id,
            type: current.type,
            name: current.name,
            en: current.en || "",
            opera: current.opera || "",
            functionName: current.code || "",
            beforeParentId: before[id].parentId,
            beforeParentName: before[id].parentName,
            beforeParentPath: before[id].parentPath,
            afterParentId: after[id].parentId,
            afterParentName: after[id].parentName,
            afterParentPath: after[id].parentPath
          };
        });
    }

    function updateExport() {
      const payload = {
        tool: "cpu3_menu_sorter",
        sourceInfo: SOURCE_INFO,
        changedParents: diffSummary(),
        nameChanges: nameChangeSummary(),
        parentChanges: parentChangeSummary(),
        orders: collectOrders(tree),
        cHints: makeCHints()
      };
      exportText.value = JSON.stringify(payload, null, 2);
    }

    function makeCHints() {
      const lines = [];
      collectOrders(tree).forEach((entry) => {
        const ids = entry.items.map((item) => item.opera || item.functionName || item.id).filter(Boolean);
        if (ids.length === 0) return;
        lines.push("/* " + entry.parentPath + " */");
        lines.push(ids.join("\n"));
        lines.push("");
      });
      return lines.join("\n");
    }

    function collectIds(root) {
      const ids = [];
      walk(root, (node) => ids.push(node.id));
      return ids;
    }

    function updateWarnings() {
      const ids = collectIds(tree);
      const initialIds = collectIds(initialTree);
      const dup = ids.filter((id, index) => ids.indexOf(id) !== index);
      const missing = initialIds.filter((id) => !ids.includes(id));
      const extra = ids.filter((id) => !initialIds.includes(id));
      const changed = diffSummary();
      const nameChanges = nameChangeSummary();
      const parentChanges = parentChangeSummary();
      const warnings = [];

      if (missing.length) warnings.push("缺失项：" + missing.join(", "));
      if (extra.length) warnings.push("新增未知项：" + extra.join(", "));
      if (dup.length) warnings.push("重复项：" + [...new Set(dup)].join(", "));
      if (changed.some((item) => item.parentId.startsWith("group_") || item.parentId.startsWith("param_"))) {
        warnings.push("参数显示顺序或菜单归属发生变化：后续改固件时需要同步 ParamGroupOf()、静态菜单数组或参数显示顺序。");
      }
      if (nameChanges.length > 0) {
        warnings.push("已有 " + nameChanges.length + " 项名称变化：后续需要检查 OLED 显示宽度和 CPU3 字库覆盖。");
      }
      if (parentChanges.length > 0) {
        warnings.push("已有 " + parentChanges.length + " 项跨菜单移动：后续需要确认返回路径、菜单分组和参数读写入口一致。");
      }
      if (changed.some((item) => item.parentId.includes("relay") && item.parentId.endsWith("_status"))) {
        warnings.push("继电器报警状态是只读运行态页面，排序只影响显示，不应触发参数下发。");
      }

      warningList.innerHTML = "";
      if (warnings.length === 0) {
        const li = document.createElement("li");
        li.className = "ok";
        li.textContent = changed.length === 0 ? "当前顺序与源码初始顺序一致。" : "未发现缺失、重复或未知项。";
        warningList.appendChild(li);
      } else {
        warnings.forEach((text) => {
          const li = document.createElement("li");
          li.textContent = text;
          warningList.appendChild(li);
        });
      }
      changeStat.textContent = changed.length + " 个父级 / " + nameChanges.length + " 个名称 / " + parentChanges.length + " 个跨菜单";
    }

    function updateStats() {
      let total = 0;
      let params = 0;
      let menus = 0;
      walk(tree, (node) => {
        total++;
        if (node.type === "param" || node.type === "readonly") params++;
        if (node.type === "menu") menus++;
      });
      treeStat.textContent = total + " 项 / " + menus + " 个菜单 / " + params + " 个参数";
    }

    function resetTree() {
      tree = clone(initialTree);
      selectedId = "root";
      collapsed = new Set();
      render();
    }

    function importPayload(payload) {
      if (!payload || !Array.isArray(payload.orders)) {
        throw new Error("导入文件缺少 orders。");
      }
      tree = clone(initialTree);
      applyImportedOrders(tree, payload.orders);
      selectedId = "root";
      render();
    }

    function applyImportedOrders(root, orders) {
      const nodeMap = new Map();
      const originalParent = new Map();
      walk(root, (node, parent) => {
        nodeMap.set(node.id, node);
        if (parent) originalParent.set(node.id, parent.id);
      });

      nodeMap.forEach((node) => {
        if (canHaveChildren(node)) node.children = [];
      });

      const assigned = new Set(["root"]);
      orders.forEach((entry) => {
        const parent = nodeMap.get(entry.parentId);
        if (!canHaveChildren(parent) || !Array.isArray(entry.items)) return;
        entry.items.forEach((item) => {
          const child = nodeMap.get(item.id);
          if (!child || assigned.has(child.id)) return;
          if (!canParentAccept(parent, child)) return;
          if (wouldCreateCycle(child, parent)) return;
          parent.children.push(child);
          assigned.add(child.id);
        });
      });

      nodeMap.forEach((node) => {
        if (node.id === "root" || assigned.has(node.id)) return;
        const parent = nodeMap.get(originalParent.get(node.id)) || root;
        if (canParentAccept(parent, node) && !wouldCreateCycle(node, parent)) {
          parent.children.push(node);
        } else {
          root.children.push(node);
        }
      });
    }

    function wouldCreateCycle(child, parent) {
      let found = false;
      walk(child, (node) => {
        if (node.id === parent.id) found = true;
      });
      return found;
    }

    function expandAll() {
      collapsed = new Set();
      render();
    }

    function collapseAll() {
      const next = new Set();
      walk(tree, (node) => {
        if (node.children && node.children.length > 0 && node.id !== "root") next.add(node.id);
      });
      collapsed = next;
      render();
    }

    document.getElementById("expandAll").addEventListener("click", expandAll);
    document.getElementById("collapseAll").addEventListener("click", collapseAll);
    document.getElementById("resetBtn").addEventListener("click", resetTree);
    searchBox.addEventListener("input", render);

    document.getElementById("downloadBtn").addEventListener("click", () => {
      updateExport();
      const blob = new Blob([exportText.value], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cpu3_menu_order_result.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      updateExport();
      try {
        await navigator.clipboard.writeText(exportText.value);
      } catch (error) {
        exportText.focus();
        exportText.select();
        document.execCommand("copy");
      }
    });

    document.getElementById("importFile").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          importPayload(JSON.parse(String(reader.result)));
        } catch (error) {
          alert("导入失败：" + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
      event.target.value = "";
    });

    render();
  </script>
</body>
</html>
