name: Build Firmware (CPU2 + CPU3)

on:
  push:
    branches: ["MAIN", "main", "CMAKE", "MOTOR_TEXT"]
  pull_request:
    branches: ["MAIN", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu2-debug
            source_dir: LTD_MAIN_CPU2
            build_dir: build/LTD_MAIN_CPU2
          - target: cpu3-debug
            source_dir: LTD_DISPLAY_CPU3
            build_dir: build/LTD_DISPLAY_CPU3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (CMake, Ninja, Arm GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi

          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Configure (${{ matrix.target }})
        run: |
          cmake -S "${{ matrix.source_dir }}" -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain-arm-none-eabi.cmake" \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build (${{ matrix.target }})
        run: |
          cmake --build "${{ matrix.build_dir }}"

      - name: Upload artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifacts
          path: |
            ${{ matrix.build_dir }}/*.elf
            ${{ matrix.build_dir }}/*.hex
            ${{ matrix.build_dir }}/*.bin
            ${{ matrix.build_dir }}/*.map
          if-no-files-found: error
